name: Build Ksyxis Tweaks

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install WebView2 bootstrap requirements
        shell: pwsh
        run: npm install
      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Ksyxis Tweaks ${{ github.ref_name }}
          releaseBody: Automated Windows build of Ksyxis Tweaks.
          releaseDraft: false
          prerelease: false
